<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="disc" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#17402b"/>
      <stop offset="0.6" stop-color="#0a1a12"/>
      <stop offset="1" stop-color="#040806"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ff0b4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.55" stop-color="#ffcf3f"/>
      <stop offset="1" stop-color="#e0a012"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3d5a"/>
      <stop offset="1" stop-color="#b3001f"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fd46d"/>
      <stop offset="1" stop-color="#007a38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#37ff94" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#37ff94" stop-opacity="0"/>
    </radialGradient>
    <path id="topArc" d="M52 134 A76 76 0 0 1 204 134"/>
    <clipPath id="disc-clip"><circle cx="128" cy="128" r="86"/></clipPath>
  </defs>

  <!-- outer rim -->
  <circle cx="128" cy="128" r="124" fill="#050a07"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Kenyan flag ring: black, red, green with white separators -->
  <g fill="none" stroke-width="17" transform="rotate(-90 128 128)">
    <circle cx="128" cy="128" r="103" stroke="#2c312e" stroke-dasharray="211 436" stroke-dashoffset="0"/>
    <circle cx="128" cy="128" r="103" stroke="url(#red)" stroke-dasharray="211 436" stroke-dashoffset="-216"/>
    <circle cx="128" cy="128" r="103" stroke="url(#green)" stroke-dasharray="211 436" stroke-dashoffset="-432"/>
  </g>
  <g stroke="#fff" stroke-width="3" stroke-linecap="butt">
    <line x1="128" y1="15" x2="128" y2="35"/>
    <line x1="225.9" y1="184.5" x2="208.6" y2="174.5"/>
    <line x1="30.1" y1="184.5" x2="47.4" y2="174.5"/>
  </g>
  <circle cx="128" cy="128" r="94" fill="none" stroke="#fff" stroke-width="2.5"/>

  <!-- inner disc -->
  <circle cx="128" cy="128" r="86" fill="url(#disc)"/>
  <g clip-path="url(#disc-clip)">
    <circle cx="128" cy="112" r="64" fill="url(#glow)"/>
    <!-- stadium bowl -->
    <path d="M52 168 Q128 98 204 168" fill="none" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/>
    <path d="M66 168 Q128 112 190 168" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round"/>
    <path d="M80 168 Q128 126 176 168" fill="none" stroke="url(#red)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- pitch -->
    <path d="M40 176 H216 V214 H40 Z" fill="#0d3a22"/>
    <path d="M40 176 H216" stroke="#fff" stroke-opacity="0.55" stroke-width="1.5"/>
  </g>

  <!-- football -->
  <circle cx="128" cy="121" r="25" fill="#fff" stroke="#0a0a0a" stroke-width="2.6"/>
  <path d="M128 108 L138 115 L134 127 H122 L118 115 Z" fill="#0a0a0a"/>
  <path d="M128 108 V97 M138 115 L148 111 M134 127 L141 135 M122 127 L115 135 M118 115 L108 111" stroke="#0a0a0a" stroke-width="2.6" stroke-linecap="round"/>

  <!-- wordmark: ARENA on the arc, 254 below -->
  <text font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-size="23" letter-spacing="5" fill="#fff" stroke="#fff" stroke-width="1.4" paint-order="stroke">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">ARENA</textPath>
  </text>
  <text x="128" y="206" text-anchor="middle" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="url(#gold)" stroke="#6b4a00" stroke-width="1.2" paint-order="stroke">254</text>
</svg>
